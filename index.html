<script>
const $=i=>document.getElementById(i),cv=$('cv'),c=cv.getContext('2d');
let DPR=1,W=0,H=0,view={x:0,y:0,k:1},tv={x:0,y:0,k:1},first=1;
let objs=[],undo=[],redo=[],sel=null,tool='pen',page=null,pageCol='#12162a',lastTap=0;
const S={c:'#22e6ff',w:6,g:18,fx:'glow',cs:['#22e6ff','#a03bff','#ff3bd4'],st:'🍾',fill:false,auto:true,pulse:true,f:'Arial'};
const RB=['#ff3b6b','#ffb43b','#f4ff3b','#3bff8a','#3bd0ff','#a03bff'];
const SH={tri:()=>[[.5,0],[1,1],[0,1]],diamond:()=>[[.5,0],[1,.5],[.5,1],[0,.5]],arrow:()=>[[0,.3],[.6,.3],[.6,0],[1,.5],[.6,1],[.6,.7],[0,.7]],
star:()=>Array.from({length:10},(_,i)=>{const r=i%2?.4:1,a=-Math.PI/2+i*Math.PI/5;return[.5+.5*r*Math.cos(a),.5+.5*r*Math.sin(a)]}),
hex:()=>Array.from({length:6},(_,i)=>[.5+.5*Math.cos(i*Math.PI/3),.5+.5*Math.sin(i*Math.PI/3)])};
const TOOLS=[['pen','✏️'],['line','╱'],['ellipse','◯'],['rect','▢'],['tri','△'],['star','★'],['hex','⬡'],['diamond','◇'],['arrow','➜'],['heart','♥'],['text','Aa'],['stamp','😀'],['select','⬚'],['pan','✋'],['erase','🧽']];
TOOLS.forEach(([t,l])=>{const b=document.createElement('button');b.className='b';b.textContent=l;b.dataset.t=t;b.onclick=()=>{tool=t;if(t!=='select')sel=null;$('tb').hidden=true;mark()};$('tools').appendChild(b)});
function mark(){[...$('tools').children].forEach(b=>b.classList.toggle('on',b.dataset.t===tool));$('st').hidden=tool!=='stamp'}mark();
new ResizeObserver(()=>{DPR=devicePixelRatio||1;const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;if(first&&W){view.x=tv.x=W/2;view.y=tv.y=H/2;first=0}}).observe(cv);
const tw=(x,y)=>[(x-view.x)/view.k,(y-view.y)/view.k];
const mk=(t,e)=>Object.assign({t,c:S.c,lw:S.w,g:S.g,fx:S.fx,cs:S.cs.slice(),fill:S.fill,born:performance.now()},e);
const clone=o=>JSON.parse(JSON.stringify(o));
function snap(){undo.push(JSON.stringify(objs));if(undo.length>60)undo.shift();redo=[]}
function tm(o){c.font=o.s+'px '+o.f;return Math.max(...String(o.str).split('\n').map(l=>c.measureText(l).width))}
function bb(o){if(o.t==='pen'){const xs=o.pts.map(p=>p[0]),ys=o.pts.map(p=>p[1]),x=Math.min(...xs),y=Math.min(...ys);return{x,y,w:Math.max(...xs)-x,h:Math.max(...ys)-y}}
if(o.t==='line'){const x=Math.min(o.x1,o.x2),y=Math.min(o.y1,o.y2);return{x,y,w:Math.abs(o.x1-o.x2),h:Math.abs(o.y1-o.y2)}}
if(o.t==='text')return{x:o.x,y:o.y,w:tm(o)*o.sx,h:o.s*1.2*o.sy*String(o.str).split('\n').length};return{x:o.x,y:o.y,w:o.w,h:o.h}}
function mv(o,dx,dy){if(o.t==='pen')o.pts.forEach(p=>{p[0]+=dx;p[1]+=dy});else if(o.t==='line'){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else{o.x+=dx;o.y+=dy}}
function sc(o,fx,fy,ox,oy){const X=v=>ox+(v-ox)*fx,Y=v=>oy+(v-oy)*fy;
if(o.t==='pen')o.pts.forEach(p=>{p[0]=X(p[0]);p[1]=Y(p[1])});else if(o.t==='line'){o.x1=X(o.x1);o.x2=X(o.x2);o.y1=Y(o.y1);o.y2=Y(o.y2)}
else{o.x=X(o.x);o.y=Y(o.y);if(o.t==='text'){o.sx*=fx;o.sy*=fy}else{o.w*=fx;o.h*=fy}}}
function path(g,o){g.beginPath();
if(o.t==='pen'){const p=o.pts;g.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++)g.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);g.lineTo(p[p.length-1][0],p[p.length-1][1])}
else if(o.t==='line'){g.moveTo(o.x1,o.y1);g.lineTo(o.x2,o.y2)}
else if(o.t==='ellipse')g.ellipse(o.x+o.w/2,o.y+o.h/2,Math.abs(o.w/2)+.01,Math.abs(o.h/2)+.01,0,0,7);
else if(o.t==='rect'){g.rect(o.x,o.y,o.w,o.h)}
else if(o.t==='heart'){const{x,y,w,h}=o;g.moveTo(x+w/2,y+h);g.bezierCurveTo(x-w*.25,y+h*.35,x+w*.1,y-h*.2,x+w/2,y+h*.25);g.bezierCurveTo(x+w*.9,y-h*.2,x+w*1.25,y+h*.35,x+w/2,y+h);g.closePath()}
else{SH[o.t]().forEach((q,i)=>g[i?'lineTo':'moveTo'](o.x+q[0]*o.w,o.y+q[1]*o.h));g.closePath()}}
function col(g,o,b,fillMode){if(o.fx==='neon'&&!fillMode)return'#fff';const cs=o.fx==='multi'?(o.cs||S.cs):o.fx==='rainbow'?RB:null;if(!cs)return o.c;const r=g.createLinearGradient(b.x,b.y,b.x+(b.w||1),b.y+b.h);cs.forEach((s,i)=>r.addColorStop(i/(cs.length-1),s));return r}
function drawObj(g,o,k,now){const a=Math.min(1,(now-o.born)/400),e=a*a*(3-2*a);g.save();g.globalAlpha=e;
const gl=o.g*(1+(S.pulse?.18*Math.sin(now/380):0))*k,b=bb(o);
g.lineWidth=o.lw;g.lineCap=g.lineJoin='round';if(o.fx==='dash')g.setLineDash([o.lw*2,o.lw*1.6]);
const gc=o.fx==='rainbow'?'#fff':o.fx==='multi'?(o.cs||S.cs)[1]:o.c;if(o.fx==='multi'&&o.t==='pen'&&o.pts.length>2){multiPen(g,o,gl);g.restore();return}
if(o.t==='text'){g.translate(o.x,o.y);g.scale(o.sx,o.sy);g.font=o.s+'px '+o.f;g.textBaseline='top';
g.fillStyle=col(g,o,{x:0,y:0,w:b.w/o.sx,h:0},o.fx!=='neon');g.shadowColor=gc;g.shadowBlur=gl;const ls=String(o.str).split('\n');ls.forEach((l,i)=>g.fillText(l,0,i*o.s*1.2));if(o.g>0)ls.forEach((l,i)=>g.fillText(l,0,i*o.s*1.2))}
else{path(g,o);
if(o.fill&&o.t!=='pen'&&o.t!=='line'){g.globalAlpha=e*.45;g.fillStyle=col(g,o,b,1);g.fill();g.globalAlpha=e}
g.strokeStyle=col(g,o,b);g.shadowColor=gc;g.shadowBlur=gl;g.stroke();if(o.g>0)g.stroke()}
g.restore()}
function render(){const now=performance.now();for(const k of['x','y','k'])view[k]+=(tv[k]-view[k])*.2;
c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#0b0d14';c.fillRect(0,0,W,H);
const gs=40*view.k;if(gs>12){c.fillStyle='#ffffff14';for(let x=((view.x%gs)+gs)%gs;x<W;x+=gs)for(let y=((view.y%gs)+gs)%gs;y<H;y+=gs)c.fillRect(x,y,1.5,1.5)}
const T=DPR*view.k;c.setTransform(T,0,0,T,DPR*view.x,DPR*view.y);
c.save();if(page){c.shadowColor='#000';c.shadowBlur=30*T;c.fillStyle=pageCol;c.fillRect(0,0,page.w,page.h);c.shadowBlur=0;c.beginPath();c.rect(0,0,page.w,page.h);c.clip()}
const vx0=-view.x/view.k,vy0=-view.y/view.k,vx1=vx0+W/view.k,vy1=vy0+H/view.k,cu=objs.length>120;objs.forEach(o=>{if(cu&&o.t!=='pen'){let a,b,w,h;if(o.t==='line'){a=Math.min(o.x1,o.x2);b=Math.min(o.y1,o.y2);w=Math.abs(o.x1-o.x2);h=Math.abs(o.y1-o.y2)}else if(o.t==='text'){a=o.x;b=o.y;w=600*o.sx;h=o.s*1.3*o.sy*String(o.str).split('\n').length}else{a=o.x;b=o.y;w=o.w;h=o.h}const p=(o.g||0)+(o.lw||0)+10;if(a>vx1+p||b>vy1+p||a+w<vx0-p||b+h<vy0-p)return}drawObj(c,o,T,now)});c.restore();
if(sel&&objs.includes(sel)){const b=bb(sel),p=6/view.k;c.save();c.strokeStyle='#22e6ff';c.lineWidth=1.5/view.k;c.setLineDash([6/view.k,4/view.k]);c.strokeRect(b.x-p,b.y-p,b.w+2*p,b.h+2*p);c.setLineDash([]);c.fillStyle='#22e6ff';c.beginPath();c.arc(b.x+b.w,b.y+b.h,11/view.k,0,7);c.fill();c.restore()}
requestAnimationFrame(render)}
requestAnimationFrame(render);
function hit(x,y){const p=10/view.k;for(let i=objs.length-1;i>=0;i--){const o=objs[i],b=bb(o),q=Math.max(p,o.lw||0);if(x>=b.x-q&&x<=b.x+b.w+q&&y>=b.y-q&&y<=b.y+b.h+q)return o}return null}
function detect(o){const p=o.pts;if(p.length<6)return;const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),w=x1-x0,h=y1-y0,dg=Math.hypot(w,h);if(dg<12/view.k)return;
const a=p[0],z=p[p.length-1],gap=Math.hypot(a[0]-z[0],a[1]-z[1]);let n=null;
const conv=(t,e)=>{n={...o,t,...e,born:performance.now()};delete n.pts};
if(gap>dg*.35){let md=0;p.forEach(q=>{md=Math.max(md,Math.abs((z[0]-a[0])*(a[1]-q[1])-(a[0]-q[0])*(z[1]-a[1]))/gap)});if(md<gap*.09)conv('line',{x1:a[0],y1:a[1],x2:z[0],y2:z[1]})}
else{const near=p.filter(q=>Math.min(Math.abs(q[0]-x0),Math.abs(q[0]-x1))<w*.12||Math.min(Math.abs(q[1]-y0),Math.abs(q[1]-y1))<h*.12).length/p.length;
const cx=x0+w/2,cy=y0+h/2,rs=p.map(q=>Math.hypot((q[0]-cx)/(w/2||1),(q[1]-cy)/(h/2||1))),m=rs.reduce((s,v)=>s+v)/rs.length,sd=Math.sqrt(rs.reduce((s,v)=>s+(v-m)**2,0)/rs.length);
if(near>.9&&w>0&&h>0)conv('rect',{x:x0,y:y0,w,h});
else if(sd<.14&&m>.8&&m<1.2){if(Math.abs(w/h-1)<.2){const d=(w+h)/2;conv('ellipse',{x:cx-d/2,y:cy-d/2,w:d,h:d})}else conv('ellipse',{x:x0,y:y0,w,h})}}
if(n)objs[objs.indexOf(o)]=n}
const ptrs=new Map();let drag=null,pinch=null;
function endPartial(){if(drag&&(drag.m==='draw'||drag.m==='shape')){objs.splice(objs.indexOf(drag.o),1);undo.pop()}drag=null}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
if(ptrs.size===2){endPartial();const[p,q]=[...ptrs.values()];pinch={d:Math.hypot(p[0]-q[0],p[1]-q[1])||1,vx:tv.x,vy:tv.y,k:tv.k,cx:(p[0]+q[0])/2,cy:(p[1]+q[1])/2};return}
if(ptrs.size>2)return;
const[x,y]=tw(e.offsetX,e.offsetY),pan={m:'pan',sx:e.offsetX,sy:e.offsetY,vx:tv.x,vy:tv.y};
if(tool==='pan'){drag=pan;return}
if(tool==='select'){if(sel){const b=bb(sel);if(Math.hypot((b.x+b.w-x)*view.k,(b.y+b.h-y)*view.k)<24){snap();drag={m:'rs',o:clone(sel),b};return}}
const h=hit(x,y),n=performance.now();if(h&&h===sel&&h.t==='text'&&n-lastTap<350){openText(0,0,h);return}lastTap=n;sel=h;if(h){snap();drag={m:'mv',lx:x,ly:y};syncUI(h)}else drag=pan;return}
if(tool==='erase'){drag={m:'er',s:0};erase(x,y);return}
if(tool==='text'){openText(x,y);return}
if(tool==='stamp'){snap();const o=mk('text',{x:x-30,y:y-36,str:S.st,s:60,f:'Arial',sx:1,sy:1});objs.push(o);sel=o;tool='select';mark();return}
sel=null;snap();let o;
if(tool==='pen')o=mk('pen',{pts:[[x,y]]});else if(tool==='line')o=mk('line',{x1:x,y1:y,x2:x,y2:y});else o=mk(tool,{x,y,w:0,h:0});
objs.push(o);drag={m:tool==='pen'?'draw':'shape',o,sx:x,sy:y}};
cv.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
if(ptrs.size===2&&pinch){const[p,q]=[...ptrs.values()],d=Math.hypot(p[0]-q[0],p[1]-q[1]),cx=(p[0]+q[0])/2,cy=(p[1]+q[1])/2,nk=Math.min(20,Math.max(.05,pinch.k*d/pinch.d)),wx=(pinch.cx-pinch.vx)/pinch.k,wy=(pinch.cy-pinch.vy)/pinch.k;
tv.k=view.k=nk;tv.x=view.x=cx-wx*nk;tv.y=view.y=cy-wy*nk;return}
if(!drag)return;const[x,y]=tw(e.offsetX,e.offsetY);
